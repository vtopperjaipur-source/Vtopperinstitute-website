<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Registration Form</title>
    <style>
        /* CSS Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #71b7e6, #9b59b6);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #fff;
            max-width: 500px;
            width: 100%;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .container h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
            font-size: 24px;
            position: relative;
        }

        .container h2::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: -5px;
            transform: translateX(-50%);
            height: 3px;
            width: 50px;
            background: #9b59b6;
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        .form-group input, 
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-group input:focus, 
        .form-group select:focus {
            border-color: #9b59b6;
            box-shadow: 0 0 5px rgba(155, 89, 182, 0.5);
        }

        /* Fee field ko read-only ya highlight karne ke liye */
        .fee-input {
            background-color: #f9f9f9;
            font-weight: bold;
            color: #2c3e50;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #71b7e6, #9b59b6);
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, #9b59b6, #71b7e6);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Test Registration</h2>
        <form action="#" method="POST">
            
            <!-- 1. Name Field -->
            <div class="form-group">
                <label for="name">Full Name (पूरा नाम)</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
            </div>

            <!-- 2. Contact Details -->
            <div class="form-group">
                <label for="contact">Contact Number (संपर्क नंबर)</label>
                <input type="tel" id="contact" name="contact" placeholder="Enter 10-digit mobile number" pattern="[0-9]{10}" required>
            </div>

            <!-- 3. Place / Address -->
            <div class="form-group">
                <label for="place">Place / City (स्थान)</label>
                <input type="text" id="place" name="place" placeholder="Enter your city or place" required>
            </div>

            <!-- 4. Course Selection -->
            <div class="form-group">
                <label for="course">Select Course (कोर्स चुनें)</label>
                <select id="course" name="course" required onchange="updateFee()">
                    <option value="" disabled selected>-- Choose a Course --</option>
                    <option value="web-dev">Web Development</option>
                    <option value="data-science">Data Science</option>
                    <option value="digital-marketing">Digital Marketing</option>
                </select>
            </div>

            <!-- 5. Fee Details (Auto-update feature logic ready) -->
            <div class="form-group">
                <label for="fee">Course Fee (फीस)</label>
                <input type="text" id="fee" name="fee" class="fee-input" placeholder="Select course to see fee" readonly>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn">Register Now</button>

        </form>
    </div>

    <!-- Choti si JavaScript taaki Course badalne par Fee apne aap dikhe -->
    <script>
        function updateFee() {
            const courseSelect = document.getElementById('course');
            const feeInput = document.getElementById('fee');
            
            // Alag-alag course ki fees yahan set karein
            const fees = {
                'web-dev': '₹ 5,000',
                'data-science': '₹ 8,000',
                'digital-marketing': '₹ 4,000'
            };

            const selectedCourse = courseSelect.value;
            feeInput.value = fees[selectedCourse] || '';
        }
    </script>

</body>
</html>
